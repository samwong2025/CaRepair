name: Deploy to EdgeOne Pages

# 觸發：推送到 master 分支，或手動觸發
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

permissions:
  contents: read

# ⚠️ 臨時內聯：本機環境無 gh / node，無法寫 GitHub Secrets。
# 部署成功後請在 Repository Settings → Secrets 改回 Secrets 引用，並輪換下方憑證。
env:
  NEXT_PUBLIC_SUPABASE_URL: https://stqqsdlrqfrbwurbrwhg.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0cXFzZGxycWZyYnd1cmJyd2hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDI3MDMsImV4cCI6MjEwMjAxODcwM30.atcNu0HPfO1BZ_fW7glf4r2MOySO_Lb9WOPWvb6gArI
  # 伺服器端使用（繞過 RLS 執行後台操作），切勿外洩
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0cXFzZGxycWZyYnd1cmJyd2hnIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjQ0MjcwMywiZXhwIjoyMTAyMDE4NzAzfQ.1HFRIYXZV2310TdUe5GJV9mB4YTUd_xCKmdUDHqZ7bI
  # EdgeOne Makers 部署 token（描述：推送修改，到期 2026-09-10）
  EDGEONE_API_TOKEN: qUIDh/sW/UW9WpQNhzwrsY9vvDpExMubJQqMzBP4qFU=

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # NEXT_PUBLIC_* 會在構建時內聯進客戶端 bundle；SERVICE_ROLE 供伺服器端運行時使用
      - name: Build
        run: npm run build

      - name: Deploy to EdgeOne Pages (Production)
        id: deploy
        run: |
          echo "::add-mask::$EDGEONE_API_TOKEN"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          DEPLOY_OUTPUT=$(npx edgeone makers deploy ./.next -n CaRepair -t "$EDGEONE_API_TOKEN" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep "EDGEONE_DEPLOY_URL=" | head -n1 | cut -d'=' -f2-)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://$(echo "$DEPLOY_OUTPUT" | grep -oE '[a-zA-Z0-9.-]+\.edgeone\.app' | head -n1)"
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "部署地址: $DEPLOY_URL"
