name: Deploy to EdgeOne Pages

# 触发：推送到 master 分支，或手动触发
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # NEXT_PUBLIC_* 会在构建时内联进客户端 bundle，必须在此注入
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to EdgeOne Pages (Production)
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(npx edgeone makers deploy ./.next -n CaRepair -t "$EDGEONE_API_TOKEN" 2>&1)
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep "EDGEONE_DEPLOY_URL=" | head -n1 | cut -d'=' -f2-)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://$(echo "$DEPLOY_OUTPUT" | grep -oE '[a-zA-Z0-9.-]+\.edgeone\.app' | head -n1)"
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "部署地址: $DEPLOY_URL"
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      # 部署成功后，自动把公网地址推送到微信（Server酱）
      - name: Notify via WeChat (Server酱)
        if: ${{ success() && secrets.WECHAT_PUSH_TOKEN != '' }}
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.DEPLOY_URL }}"
          curl -s -X POST "https://sctapi.ftqq.com/${{ secrets.WECHAT_PUSH_TOKEN }}.send" \
            --data-urlencode "title=CaRepair 已部署公网 ✅" \
            --data-urlencode "desp=公网地址：${DEPLOY_URL}%0A部署时间：$(date '+%Y-%m-%d %H:%M:%S')"
