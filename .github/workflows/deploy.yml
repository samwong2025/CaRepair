name: Build Check

# 說明：CaRepair 的 EdgeOne 專案 Provider 為 'Github'，
# 部署由 EdgeOne 的 GitHub 整合自動完成（push 即自動建置+上線），
# 不需要也不能用 `edgeone makers deploy` 手動上傳。
# 此 workflow 僅做 build 校驗，確保程式碼可編譯。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          # 僅供本機 build 校驗使用；正式部署的 NEXT_PUBLIC_* 由 EdgeOne 控制台環境變數注入
          NEXT_PUBLIC_SUPABASE_URL: https://stqqsdlrqfrbwurbrwhg.supabase.co
